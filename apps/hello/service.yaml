apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: NodePort
  selector:
    app: hello              # envoie le trafic aux Pods qui ont ce label
  ports:
    - port: 80              # port du Service dans le cluster
      targetPort: 80        # port du conteneur
      nodePort: 30080       # port ouvert sur le nœud